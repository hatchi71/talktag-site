<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Boot Camp Level · TalkTag</title>
  <style>
    :root{--n:#082b68;--b:#1768e9;--g:#248153;--o:#ff6a10;--l:#dbe5f1;--m:#687b92;--shadow:0 15px 35px rgba(24,52,85,.09)}*{box-sizing:border-box}body{margin:0;color:#183455;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{height:74px;position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:11px;color:var(--n);font-weight:850}.brand a{display:flex}.brand img{width:68px;height:54px;object-fit:contain}.back{color:var(--b);text-decoration:none;font-size:12px;font-weight:850}.wrap{max-width:1000px;margin:auto;padding:45px 22px 82px}.ey{font-size:11px;color:var(--g);font-weight:950;letter-spacing:.13em}h1{font-size:clamp(42px,6vw,58px);color:var(--n);margin:8px 0}.intro{max-width:720px;color:var(--m);line-height:1.7}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:31px}.item{position:relative;display:block;min-height:145px;padding:19px;border:1px solid var(--l);border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s}.item:hover{transform:translateY(-3px);border-color:#84c6a1;box-shadow:0 19px 42px rgba(24,52,85,.14)}.item:focus-visible{outline:3px solid #8bd0aa;outline-offset:3px}.num{font-size:10px;color:var(--o);font-weight:950;letter-spacing:.08em}.item h2{font-size:19px;color:var(--n);margin:8px 0}.item p{font-size:12px;color:#728198;margin:0;line-height:1.55}.item:after{content:"RETELL →";position:absolute;right:18px;bottom:17px;color:var(--g);font-size:9px;font-weight:950;letter-spacing:.08em}.error{margin-top:30px;padding:20px;border-radius:16px;background:#fff0e8;color:#9b4725}
    @media(max-width:680px){.top{height:68px;padding:0 12px}.brand img{width:56px}.brand span{font-size:12px}.wrap{padding:30px 16px 65px}.list{grid-template-columns:1fr}.item{min-height:138px}h1{font-size:42px}}
    .read-mode .item:after{content:"READ →";color:var(--b)}
  </style>
  <script src="/talktag-home.js?v=20260922h" defer></script>
<link rel="stylesheet" href="talktag-theme.css?v=20260926-mobile3">
<script src="talktag-theme.js?v=2"></script>
</head>
<body>
  <header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span id="brandLabel">Snowballing Studio · Boot Camp</span></div><a class="back" id="backLink" href="bootcamp.html">← 레벨 선택</a></header>
  <main class="wrap"><div class="ey" id="ey">STORY RETELLING</div><h1 id="title">이야기 불러오는 중…</h1><p class="intro" id="intro"></p><div class="list" id="list"></div></main>
  <script>
    const descriptions={A1:'짧고 분명한 일상 사건을 시간 순서대로 다시 말해 보세요.',A2:'친숙한 상황의 원인과 결과를 연결해 자연스럽게 재구성합니다.',B1:'인물의 경험과 감정, 변화의 계기를 연결해 완결된 이야기로 말합니다.',B2:'선택의 이유와 이야기의 의미를 포함해 풍부하게 다시 말합니다.',C1:'복합적인 사건과 관점, 함축된 의미를 정교하게 재구성합니다.',C2:'서술의 뉘앙스와 분위기를 살려 자신만의 목소리로 전달합니다.'};
    const params=new URLSearchParams(location.search);const readableMode=params.get('mode')==='readable';let level=(params.get('level')||'A1').toUpperCase();if(!descriptions[level])level='A1';
    if(readableMode){document.body.classList.add('read-mode');document.getElementById('brandLabel').textContent='Snowballing Studio · Readable';document.getElementById('backLink').href='readable.html';document.getElementById('backLink').textContent='← Readable 레벨 선택';}
    fetch('talktag_story_retelling_A1-C2_60.json').then(response=>{if(!response.ok)throw Error('load');return response.json()}).then(data=>{
      const stories=data.filter(story=>story.level===level);document.title=readableMode?`${level} Readables · TalkTag`:`${level} Story Camp · TalkTag`;document.getElementById('ey').textContent=`${level} · ${stories.length} ${readableMode?'READABLES':'STORIES'}`;document.getElementById('title').textContent=readableMode?`${level} Readables`:`${level} Story Camp`;document.getElementById('intro').textContent=descriptions[level];
      document.getElementById('list').innerHTML=stories.map((story,index)=>`<a class="item" href="bootcamp-story.html?level=${encodeURIComponent(level)}&id=${index+1}${readableMode?'&mode=readable':''}"><div class="num">${story.id} · ${story.genre}</div><h2>${story.title}</h2><p>${readableMode?'Read → Recall → Reflect → Talk':'Read → Map → Retell → Own'}</p></a>`).join('');
    }).catch(()=>{document.getElementById('title').textContent='이야기를 불러오지 못했습니다.';document.getElementById('list').innerHTML='<div class="error">JSON 파일과 페이지 경로를 확인해 주세요.</div>'});
  </script>
</body>
</html>
