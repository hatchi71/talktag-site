<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>TalkTag Readable · Level route</title>
  <script>
    const params = new URLSearchParams(location.search);
    const levels = ['A1','A2','B1','B2','C1','C2'];
    const level = levels.includes(params.get('level')) ? params.get('level') : 'A1';
    location.replace(params.get('mode') === 'readable'
      ? 'readable.html?level=' + encodeURIComponent(level)
      : 'story-camp.html?level=' + encodeURIComponent(level));
  </script>
</head>
<body><p>Opening the current <a href="readable.html">Readable collection</a>…</p></body>
</html>
