name: Guided audio protocol
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-guided-cards.mjs
      - run: node scripts/validate-camp-navigation.mjs
      - run: node scripts/validate-native-guided-cards.mjs
      - run: node scripts/validate-korean-navigation.mjs
      - run: node scripts/validate-korean-essay-controls.mjs
      - run: node scripts/validate-glr-scene-art.mjs
      - run: node scripts/update-home-news.mjs --check
      - run: node scripts/update-sitemap.mjs --check
      - run: node scripts/verify-pwa-update.mjs
