<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Story Retelling · TalkTag Boot Camp</title>
  <style>
    :root{--n:#082b68;--b:#1768e9;--g:#248153;--o:#ff6a10;--ink:#183455;--m:#687b92;--l:#dbe5f1;--yellow:#fff7ae;--mint:#e8f8ed;--shadow:0 16px 40px rgba(24,52,85,.1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{height:74px;position:sticky;top:0;z-index:8;background:#fffffff3;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;color:var(--n);font-weight:850}.brand a{display:flex}.brand img{width:68px;height:54px;object-fit:contain}.back{color:var(--b);text-decoration:none;font-size:12px;font-weight:850}.wrap{max-width:900px;margin:auto;padding:44px 23px 86px}.ey{font-size:11px;color:var(--g);font-weight:950;letter-spacing:.13em}h1{font-size:clamp(38px,6vw,58px);line-height:1.03;color:var(--n);letter-spacing:-.045em;margin:9px 0 11px}.genre{color:var(--m);font-size:13px}.progress{display:flex;flex-wrap:wrap;gap:7px;margin:23px 0 31px}.progress span{padding:7px 10px;border-radius:999px;background:#edf3f8;color:#58718d;font-size:10px;font-weight:900}.progress span:first-child{background:#dff6e6;color:#246847}.section{margin-top:25px;padding:25px;border:1px solid var(--l);border-radius:22px;background:#fff;box-shadow:var(--shadow)}.section h2{margin:0 0 7px;color:var(--n);font-size:25px}.guide{color:var(--m);font-size:13px;line-height:1.65}.story{margin-top:20px;padding:25px;border-radius:18px;background:var(--yellow);transition:filter .2s,opacity .2s}.story-unit{margin-bottom:20px}.story-unit:last-child{margin-bottom:0}.story-unit>p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.82;margin:0}.kr-toggle{display:block;min-width:54px;margin:8px 0 0 13px;padding:7px 13px;border:1px solid #ead8b8;border-top:0;border-radius:0 0 10px 10px;background:#fff8ec;color:#97631d;font-size:10px;font-weight:950;letter-spacing:.07em;cursor:pointer;box-shadow:0 4px 9px rgba(105,78,34,.08)}.kr-toggle:hover,.kr-toggle:focus-visible{background:#fff1d8;outline:2px solid #e7bd75;outline-offset:2px}.kr-panel{display:none;margin:0;padding:14px 16px;border:1px solid #ead8b8;border-radius:12px;background:#fffaf1;color:#605846}.kr-panel.open{display:block}.kr-panel p{margin:0;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.75}.story.hidden{filter:blur(10px);opacity:.2;pointer-events:none;user-select:none}.toggle{margin-top:16px;border:0;border-radius:12px;background:var(--n);color:#fff;padding:11px 15px;font-size:11px;font-weight:900;cursor:pointer}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:18px}.cue{padding:17px;border-radius:15px;background:#f2f6fa}.cue b{display:block;color:var(--g);font-size:11px;margin-bottom:7px}.cue span{font-size:13px;line-height:1.55;color:#5e7187}.retells{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}.retell{padding:18px;border:1px solid #d9e9df;border-radius:16px;background:var(--mint)}.retell b{display:block;color:var(--n);font-size:15px;margin-bottom:9px}.retell p{margin:0;color:#5f7489;font-size:12px;line-height:1.6}.starters{margin-top:16px;padding:17px;border-radius:15px;background:#edf4ff;color:#42658c;font-size:13px;line-height:1.75}.starters b{color:var(--b)}.own{background:linear-gradient(145deg,#fff,#edf9f1);border-color:#cae8d4}.own-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:17px}.own-grid div{padding:17px;border-radius:15px;background:#fff;color:#5f7489;font-size:13px;line-height:1.6}.own-grid b{display:block;color:var(--o);margin-bottom:6px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.nav a{flex:1;padding:14px;border:1px solid var(--l);border-radius:13px;background:#fff;color:var(--b);text-align:center;text-decoration:none;font-size:12px;font-weight:900}.error{padding:20px;border-radius:15px;background:#fff0e8;color:#9b4725}
    @media(max-width:700px){.top{height:68px;padding:0 12px}.brand img{width:56px}.brand span{font-size:12px}.wrap{padding:30px 16px 68px}.section{padding:20px 17px}.story{padding:20px}.story p{font-size:17px}.map,.retells,.own-grid{grid-template-columns:1fr}.nav{flex-direction:column}}
  </style>
  <script src="/talktag-home.js?v=20260922h" defer></script>
<link rel="stylesheet" href="talktag-theme.css?v=2">
<script src="talktag-theme.js?v=2"></script>
</head>
<body>
  <header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span id="brandLabel">Snowballing Studio · Boot Camp</span></div><a class="back" id="back" href="bootcamp.html">← 이야기 목록</a></header>
  <main class="wrap" id="content"><div class="ey">STORY RETELLING</div><h1>이야기 불러오는 중…</h1></main>
  <script>
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const params=new URLSearchParams(location.search);const readableMode=params.get('mode')==='readable';const allowed=['A1','A2','B1','B2','C1','C2'];let level=(params.get('level')||'A1').toUpperCase();if(!allowed.includes(level))level='A1';let number=Math.max(1,Math.min(10,Number(params.get('id'))||1));
    Promise.all([fetch('talktag_story_retelling_A1-C2_60.json').then(response=>{if(!response.ok)throw Error('load');return response.json()}),fetch('talktag_story_retelling_ko_A1-C2_60.json').then(response=>response.ok?response.json():{}).catch(()=>({}))]).then(([data,translations])=>{
      const stories=data.filter(story=>story.level===level);const story=stories[number-1]||stories[0];if(!story)throw Error('story');document.title=`${story.title} · TalkTag ${readableMode?'Readable':'Boot Camp'}`;document.getElementById('brandLabel').textContent=`Snowballing Studio · ${readableMode?'Readable':'Boot Camp'}`;document.getElementById('back').href=`bootcamp-level.html?level=${level}${readableMode?'&mode=readable':''}`;document.getElementById('back').textContent=readableMode?'← Readable 목록':'← 이야기 목록';
      const koreanParagraphs=translations[story.id]||[];const paragraphs=story.content.split(/\n\s*\n/).filter(Boolean).map((text,index)=>{const meaning=koreanParagraphs[index];const panelId=`kr-${story.id}-${index+1}`;return `<div class="story-unit"><p>${escapeHtml(text)}</p>${meaning?`<button class="kr-toggle" type="button" aria-controls="${panelId}" aria-expanded="false">KR ▾</button><div class="kr-panel" id="${panelId}"><p>${escapeHtml(meaning)}</p></div>`:''}</div>`}).join('');
      document.getElementById('content').innerHTML=`<div class="ey">${escapeHtml(story.id)} · ${readableMode?'READABLE':'STORY RETELLING'}</div><h1>${escapeHtml(story.title)}</h1><div class="genre">${escapeHtml(story.genre)} · ${level}</div><div class="progress"><span>1 · READ</span><span>2 · ${readableMode?'RECALL':'MAP'}</span><span>3 · ${readableMode?'REFLECT':'RETELL'}</span><span>4 · ${readableMode?'TALK':'OWN'}</span></div>
      <section class="section"><h2>1. 이야기 읽기</h2><p class="guide">먼저 흐름을 이해하며 소리 내어 읽으세요. 세부 문장을 외우기보다 누가, 어디에서, 무엇을 겪었는지에 집중합니다.</p><div class="story" id="story">${paragraphs}</div><button class="toggle" id="toggle" type="button" aria-controls="story" aria-pressed="false">이야기 가리고 회상하기</button></section>
      <section class="section"><h2>${readableMode?'2. Recall & Reflect':'2. Story Map'}</h2><p class="guide">${readableMode?'원문을 덮은 뒤 핵심 상황과 인물의 변화, 글이 남기는 생각을 기억에서 꺼내세요.':'원문을 덮은 뒤 다음 다섯 질문에 짧게 답하며 이야기의 뼈대를 만드세요.'}</p><div class="map"><div class="cue"><b>WHO &amp; WHERE</b><span>누가 등장하고, 이야기는 어디에서 시작하나요?</span></div><div class="cue"><b>FIRST</b><span>처음에는 어떤 상황이었나요?</span></div><div class="cue"><b>PROBLEM</b><span>어떤 문제나 예상 밖의 일이 생겼나요?</span></div><div class="cue"><b>CHANGE</b><span>무엇이 상황을 바꾸었나요?</span></div><div class="cue"><b>ENDING</b><span>결과는 어땠고 인물은 무엇을 느끼거나 배웠나요?</span></div><div class="cue"><b>ONE LINE</b><span>이 글을 영어 한 문장으로 요약해 보세요.</span></div></div></section>
      <section class="section"><h2>${readableMode?'3. 생각 정리하기':'3. Retell Ladder'}</h2><p class="guide">${readableMode?'내용을 짧게 요약한 뒤 중요한 세부 내용과 자신의 해석을 더해 보세요.':'완벽한 문장보다 이야기의 연결을 유지하는 것이 먼저입니다. 짧게 시작한 뒤 조금씩 늘려 말하세요.'}</p><div class="retells"><div class="retell"><b>30 seconds</b><p>인물, 문제, 결말만 사용해 세 문장으로 말합니다.</p></div><div class="retell"><b>60 seconds</b><p>사건의 순서와 변화의 계기를 포함해 다시 말합니다.</p></div><div class="retell"><b>${readableMode?'Reflection':'Full retelling'}</b><p>${readableMode?'글에서 가장 인상적인 생각과 그 이유를 정리합니다.':'감정과 중요한 세부 내용을 더해 자연스럽게 전달합니다.'}</p></div></div><div class="starters"><b>Useful connectors</b><br>At first… · Then… · Because of that… · However… · Eventually… · In the end…</div></section>
      <section class="section own"><h2>${readableMode?'4. 이야기 나누기':'4. 내 이야기로 바꾸기'}</h2><p class="guide">${readableMode?'읽은 내용과 자신의 경험 또는 생각을 연결해 말하세요.':'원문의 구조는 빌리되 내용과 표현은 자신의 것으로 바꾸세요.'}</p><div class="own-grid"><div><b>${readableMode?'KEY IDEA':'CHANGE ONE DETAIL'}</b>${readableMode?'글의 핵심을 자신의 말로 설명합니다.':'장소, 인물, 문제 또는 결말 하나를 바꾼 뒤 이야기를 다시 말합니다.'}</div><div><b>MAKE IT PERSONAL</b>비슷한 경험이 있다면 원문을 보지 않고 자신의 이야기로 연결해 말합니다.</div></div></section>
      <nav class="nav" aria-label="Story navigation"><a href="?level=${level}&id=${number===1?10:number-1}${readableMode?'&mode=readable':''}">← 이전 이야기</a><a href="bootcamp-level.html?level=${level}${readableMode?'&mode=readable':''}">목록</a><a href="?level=${level}&id=${number===10?1:number+1}${readableMode?'&mode=readable':''}">다음 이야기 →</a></nav>`;
      const storyBox=document.getElementById('story'),toggle=document.getElementById('toggle');toggle.addEventListener('click',()=>{const hidden=storyBox.classList.toggle('hidden');toggle.setAttribute('aria-pressed',String(hidden));toggle.textContent=hidden?'이야기 다시 보기':'이야기 가리고 회상하기'});document.querySelectorAll('.kr-toggle').forEach(button=>button.addEventListener('click',()=>{const panel=document.getElementById(button.getAttribute('aria-controls'));const open=panel.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.textContent=open?'KR ▴':'KR ▾'}));
    }).catch(()=>{document.getElementById('content').innerHTML='<div class="error">이야기를 불러오지 못했습니다. JSON 파일과 페이지 경로를 확인해 주세요.</div>'});
  </script>
</body>
</html>
