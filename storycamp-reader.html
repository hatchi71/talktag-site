  <style>
    :root{--n:#082b68;--b:#1768e9;--g:#248153;--o:#ff6a10;--m:#687b92;--l:#dbe5f1;--y:#fff7ae;--mint:#e8f8ed;--s:0 16px 40px rgba(24,52,85,.1)}*{box-sizing:border-box}body{margin:0;color:#183455;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{min-height:74px;position:sticky;top:0;z-index:8;background:#fffffff3;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:11px;color:var(--n);font-weight:850}.brand a{display:flex;min-width:44px;min-height:44px;align-items:center}.brand img{width:68px;height:54px;object-fit:contain}.back{min-height:44px;display:flex;align-items:center;color:var(--b);text-decoration:none;font-size:12px;font-weight:850}.wrap{max-width:1000px;margin:auto;padding:44px 23px 86px}.ey{font-size:11px;color:var(--g);font-weight:950;letter-spacing:.13em}h1{font-size:clamp(38px,6vw,58px);line-height:1.03;color:var(--n);margin:9px 0 11px}.topic{color:var(--m);font-size:14px;line-height:1.65}.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:23px 0 31px}.progress span{display:grid;place-items:center;min-height:44px;padding:7px 8px;border-radius:12px;background:#edf3f8;color:#58718d;text-align:center;font-size:10px;line-height:1.35;font-weight:900}.progress span:first-child{background:#dff6e6;color:#246847}.section{margin-top:25px;padding:25px;border:1px solid var(--l);border-radius:22px;background:#fff;box-shadow:var(--s)}.section h2{margin:0 0 7px;color:var(--n);font-size:25px}.stage-purpose{margin:0 0 9px;color:var(--g);font-size:10px;font-weight:950;letter-spacing:.12em}.guide{color:var(--m);font-size:14px;line-height:1.7}.snow-steps{display:grid;gap:18px;margin-top:20px}.snow-step{overflow:hidden;border:1px solid #c9d8e8;border-left:6px solid var(--b);border-radius:19px;background:#fff;box-shadow:0 4px 0 #c4d2e1,0 15px 30px rgba(24,52,85,.12)}.step-label{padding:18px 23px 0;color:var(--o);font-size:11px;font-weight:950}.step-text{margin:18px 23px 17px;padding:22px 25px;border:1px solid #d4e4f7;border-left:6px solid var(--b);border-radius:16px;background:linear-gradient(135deg,#f8fbff,#edf5ff)}.step-text p{margin:0 0 12px;color:var(--n);font-size:clamp(19px,2.3vw,26px);font-weight:780;line-height:1.58}.step-text p:last-child{margin-bottom:0}.note-action{margin:0 23px 18px;padding:14px 16px;border-radius:13px;background:var(--mint);color:#316b4b;font-size:13px;line-height:1.65}.note-action b{display:block;margin-bottom:3px;color:var(--g);font-size:10px;letter-spacing:.1em}.kr-toggle{min-width:70px;min-height:44px;padding:10px 17px;border:0;border-top:1px solid #ead8b8;background:#fff8ec;color:#80613d;font-size:11px;font-weight:950;cursor:pointer}.step-kr{display:none;padding:16px 23px;border-top:1px dashed #e3d2b7;background:#fffaf1;color:#605846;font-size:14px;line-height:1.75}.step-kr.open{display:block}.story-reference{margin-top:18px;border:1px solid #ead58d;border-radius:17px;background:#fffdf2;overflow:hidden}.story-reference summary{min-height:48px;display:flex;align-items:center;padding:12px 17px;color:#7b622c;font-size:13px;font-weight:900;cursor:pointer}.story-reference summary::marker{color:var(--o)}.story{margin:0 15px 15px;padding:22px;border-radius:14px;background:var(--y)}.story p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.82;margin:0 0 18px}.story p:last-child{margin-bottom:0}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:18px}.cue{padding:17px;border-radius:15px;background:#f2f6fa}.cue b{display:block;color:var(--g);font-size:11px;margin-bottom:7px}.cue span{font-size:13px;line-height:1.55;color:#5e7187}.cover-note{margin-top:16px;padding:18px;border:2px dashed #e6b866;border-radius:15px;background:#fff9ee;color:#705c3f;font-size:14px;line-height:1.7}.cover-note b{display:block;color:var(--o);margin-bottom:6px}.own{background:linear-gradient(145deg,#fff,#edf9f1);border-color:#cae8d4}.own-task{margin-top:16px;padding:18px;border-radius:15px;background:#fff;color:#5f7489;font-size:14px;line-height:1.7}.own-task b{display:block;color:var(--o);margin-bottom:6px}.own-task small{display:block;margin-top:8px;color:#75879a;font-size:12px;line-height:1.6}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.nav a{flex:1;min-height:48px;display:grid;place-items:center;padding:12px;border:1px solid var(--l);border-radius:13px;background:#fff;color:var(--b);text-align:center;text-decoration:none;font-size:12px;font-weight:900}.error{padding:20px;border-radius:15px;background:#fff0e8;color:#9b4725}@media(max-width:760px){.progress{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.top{min-height:68px;padding:0 12px}.brand img{width:56px}.brand span{max-width:192px;font-size:11px;line-height:1.25}.wrap{padding:30px 16px 68px}.section{padding:20px 15px}.step-text{margin:15px;padding:17px}.note-action{margin:0 15px 15px}.map{grid-template-columns:1fr}.nav{flex-direction:column}}@media(max-width:374px){.progress{grid-template-columns:repeat(2,1fr)}}

<body><header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span>Snowballing Studio · Boot Camp · Story Camp</span></div><a class="back" id="back" href="story-camp.html">← Story Camp</a></header><main class="wrap" id="content"><div class="ey">STORY CAMP</div><h1>자료 불러오는 중…</h1></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const q=new URLSearchParams(location.search),allowed=['A1','A2','B1','B2','C1','C2'];let L=(q.get('level')||'A1').toUpperCase();if(!allowed.includes(L))L='A1';const id=Math.max(1,Math.min(10,Number(q.get('id'))||1));back.href=`storycamp-level.html?level=${L}`;
function accumulateChunks(chunks){let built='';return chunks.map(chunk=>{built=`${built}${built?' ':''}${String(chunk).trim()}`.replace(/\s+([,;:.!?])/g,'$1');return built})}
function paragraphs(text){return text.split(/\n\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}
function render(x,krText){const prompts=x.length===7?[x[4],x[5],x[6]]:[x[3],x[4],x[5]],curriculum=window.STORYCAMP_CHUNKS?.[`${L}-${id}`],steps=accumulateChunks(curriculum.en),krSteps=accumulateChunks(curriculum.ko),text=steps.at(-1);document.title=`${x[0]} · TalkTag Story Camp`;const snow=steps.map((step,i)=>{const kr=krSteps[i]||'';return `<article class="snow-step"><div class="step-label">이야기 전개 ${i+1}${i===steps.length-1?' · COMPLETE':''}</div><div class="step-text">${paragraphs(step)}</div><div class="note-action"><b>SNOWBALLING 나의 노트</b>이번 단계까지의 이야기를 처음부터 다시 누적해서 써 보세요.</div>${kr?`<button class="kr-toggle" type="button" data-target="kr-${i}" aria-expanded="false">KR ▾</button><div class="step-kr" id="kr-${i}">${paragraphs(kr)}</div>`:''}</article>`}).join('');content.innerHTML=`<div class="ey">${L}-${String(id).padStart(2,'0')} · STORY CAMP</div><h1>${esc(x[0])}</h1><div class="topic">누적해서 쓰기 → 전체 다시 쓰기 → 가리고 회상하기 → 가리고 말하기 → 나의 이야기 만들기 → 파트너에게 말하기</div><div class="progress"><span>1 · SNOWBALL</span><span>2 · REWRITE</span><span>3 · RECALL</span><span>4 · RETELL</span><span>5 · TRANSFORM</span><span>6 · SHARE</span></div><section class="section"><p class="stage-purpose">1 · SNOWBALL</p><h2>누적해서 써보기</h2><p class="guide">각 단계에서 새로 전개된 내용을 확인한 뒤, Snowballing 나의 노트에 이야기의 처음부터 이번 단계까지 누적 반복해서 써 내려갑니다.</p><div class="snow-steps">${snow}</div></section><section class="section"><p class="stage-purpose">2 · REWRITE</p><h2>전체 이야기 처음부터 다시 써보기</h2><p class="guide">지금까지 단계별로 누적해서 썼던 이야기 전체를 보지 않고 처음부터 다시 나의 노트에 적어 보세요.</p><div class="cover-note"><b>먼저 노트에 쓰세요</b>다 쓴 뒤에만 아래의 완성된 이야기를 열어 빠진 흐름과 표현을 확인합니다.</div><details class="story-reference"><summary>완성된 이야기 확인하기</summary><div class="story">${paragraphs(text)}</div></details></section><section class="section"><p class="stage-purpose">3 · RECALL</p><h2>회상해서 다시 써보기</h2><p class="guide">나의 노트와 원문을 모두 가리고, 생각나는 내용을 그대로 다시 써 보세요. 정확한 문장 복사보다 기억에서 이야기의 흐름을 꺼내는 것이 중요합니다.</p><div class="own-task"><b>MEMORY CUE · 막힐 때만</b>${esc(prompts[0]||'핵심 상황, 변화, 결과를 기억나는 순서대로 다시 써 보세요.')}</div></section><section class="section"><p class="stage-purpose">4 · RETELL</p><h2>가리고 말하기</h2><p class="guide">3단계에서 쓴 내용도 다시 덮고, 파트너에게 이야기 전체를 처음부터 끝까지 전달해 보세요.</p><div class="cover-note"><b>노트를 덮고 시작하세요</b>멈추더라도 바로 원문을 보지 말고, 기억나는 표현으로 연결해서 끝까지 말합니다.</div></section><section class="section own"><p class="stage-purpose">5 · TRANSFORM</p><h2>나의 이야기로 변형하기</h2><p class="guide">원문의 구성과 주제는 유지하면서 인물, 장소, 이유, 행동 또는 결과를 바꾸어 나의 이야기나 의견을 새로 지어 나의 노트에 써 보세요.</p><div class="map"><div class="cue"><b>SAME STRUCTURE</b><span>시작–변화–결과의 흐름은 유지합니다.</span></div><div class="cue"><b>MY STORY / OPINION</b><span>나의 경험과 생각에 맞게 세부 내용을 바꿉니다.</span></div></div><div class="own-task"><b>TRANSFORM</b>같은 흐름을 사용해 나의 경험이나 의견으로 이야기 전체를 새로 써 보세요.<small>원문의 세부 포인트: ${esc(prompts[1]||'인물, 장소, 이유 또는 결과 중 하나를 바꾸어 보세요.')}</small></div></section><section class="section own"><p class="stage-purpose">6 · SHARE</p><h2>새로 지은 이야기 말하기</h2><p class="guide">5단계에서 쓴 나의 이야기나 의견을 다시 덮고, 파트너에게 자연스럽게 말해 보세요.</p><div class="own-task"><b>TALK TO YOUR PARTNER</b>${esc(prompts[2]||'새로 만든 이야기나 의견을 노트 없이 파트너에게 전달해 보세요.')}</div></section><nav class="nav"><a href="?level=${L}&id=${id===1?10:id-1}">← 이전</a><a href="storycamp-level.html?level=${L}">목록</a><a href="?level=${L}&id=${id===10?1:id+1}">다음 →</a></nav>`;document.querySelectorAll('.kr-toggle').forEach(button=>button.addEventListener('click',()=>{const panel=document.getElementById(button.dataset.target),open=panel.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.textContent=open?'KR ▴':'KR ▾'}))}
if(['C1','C2'].includes(L)){const script=document.createElement('script');script.src=L==='C1'?'readable-c1.js':'readable-c2.js';script.onload=()=>render(window.READABLE_ADVANCED[id-1],(window.READABLE_KR_ADVANCED?.[L]||[])[id-1]);script.onerror=()=>{content.innerHTML='<div class="error">자료를 불러오지 못했습니다.</div>'};document.head.appendChild(script)}else{fetch('readable-essay.html').then(r=>r.text()).then(src=>{const m=src.match(/const D=(\{[\s\S]*?\});\s*const q=/);if(!m)throw Error('data');let D;eval('D='+m[1]);render(D[L][id-1],(window.READABLE_KR?.[L]||[])[id-1])}).catch(()=>{content.innerHTML='<div class="error">자료를 불러오지 못했습니다.</div>'})}
</script></body></html>
