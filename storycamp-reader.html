<!doctype html>
<html lang="ko">
<head>

  <style>
    :root{--n:#082b68;--b:#1768e9;--g:#248153;--o:#ff6a10;--m:#687b92;--l:#dbe5f1;--y:#fff7ae;--mint:#e8f8ed;--s:0 16px 40px rgba(24,52,85,.1)}*{box-sizing:border-box}body{margin:0;color:#183455;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{height:74px;position:sticky;top:0;z-index:8;background:#fffffff3;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:11px;color:var(--n);font-weight:850}.brand a{display:flex}.brand img{width:68px;height:54px;object-fit:contain}.back{color:var(--b);text-decoration:none;font-size:12px;font-weight:850}.wrap{max-width:1000px;margin:auto;padding:44px 23px 86px}.ey{font-size:11px;color:var(--g);font-weight:950;letter-spacing:.13em}h1{font-size:clamp(38px,6vw,58px);line-height:1.03;color:var(--n);margin:9px 0 11px}.topic{color:var(--m);font-size:14px}.progress{display:flex;flex-wrap:wrap;gap:7px;margin:23px 0 31px}.progress span{padding:7px 10px;border-radius:999px;background:#edf3f8;color:#58718d;font-size:10px;font-weight:900}.progress span:first-child{background:#dff6e6;color:#246847}.section{margin-top:25px;padding:25px;border:1px solid var(--l);border-radius:22px;background:#fff;box-shadow:var(--s)}.section h2{margin:0 0 7px;color:var(--n);font-size:25px}.guide{color:var(--m);font-size:13px;line-height:1.65}.snow-steps{display:grid;gap:18px;margin-top:20px}.snow-step{overflow:hidden;border:1px solid #c9d8e8;border-left:6px solid var(--b);border-radius:19px;background:#fff;box-shadow:0 4px 0 #c4d2e1,0 15px 30px rgba(24,52,85,.12)}.step-label{padding:18px 23px 0;color:var(--o);font-size:11px;font-weight:950}.step-text{margin:18px 23px 23px;padding:22px 25px;border:1px solid #d4e4f7;border-left:6px solid var(--b);border-radius:16px;background:linear-gradient(135deg,#f8fbff,#edf5ff)}.step-text p{margin:0 0 12px;color:var(--n);font-size:clamp(19px,2.3vw,26px);font-weight:780;line-height:1.58}.step-text p:last-child{margin-bottom:0}.kr-toggle{min-width:70px;padding:10px 17px;border:0;border-top:1px solid #ead8b8;background:#fff8ec;color:#80613d;font-size:11px;font-weight:950;cursor:pointer}.step-kr{display:none;padding:16px 23px;border-top:1px dashed #e3d2b7;background:#fffaf1;color:#605846;font-size:14px;line-height:1.75}.step-kr.open{display:block}.story{margin-top:20px;padding:25px;border-radius:18px;background:var(--y)}.story p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.82;margin:0 0 18px}.story p:last-child{margin-bottom:0}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:18px}.cue{padding:17px;border-radius:15px;background:#f2f6fa}.cue b{display:block;color:var(--g);font-size:11px;margin-bottom:7px}.cue span{font-size:13px;line-height:1.55;color:#5e7187}.own{background:linear-gradient(145deg,#fff,#edf9f1);border-color:#cae8d4}.own-task{margin-top:16px;padding:18px;border-radius:15px;background:#fff;color:#5f7489;font-size:13px;line-height:1.7}.own-task b{display:block;color:var(--o);margin-bottom:6px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px}.nav a{flex:1;padding:14px;border:1px solid var(--l);border-radius:13px;background:#fff;color:var(--b);text-align:center;text-decoration:none;font-size:12px;font-weight:900}.error{padding:20px;border-radius:15px;background:#fff0e8;color:#9b4725}@media(max-width:700px){.top{height:68px;padding:0 12px}.brand img{width:56px}.brand span{font-size:11px}.wrap{padding:30px 16px 68px}.section{padding:20px 15px}.step-text{margin:15px;padding:17px}.map{grid-template-columns:1fr}.nav{flex-direction:column}}
  </style>

</head>
<body><header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span>Snowballing Studio · Boot Camp · Story Camp</span></div><a class="back" id="back" href="bootcamp.html#story-camp">← Story Camp</a></header><main class="wrap" id="content"><div class="ey">STORY CAMP</div><h1>자료 불러오는 중…</h1></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const q=new URLSearchParams(location.search),allowed=['A1','A2','B1','B2','C1','C2'];let L=(q.get('level')||'A1').toUpperCase();if(!allowed.includes(L))L='A1';const id=Math.max(1,Math.min(10,Number(q.get('id'))||1));back.href=`storycamp-level.html?level=${L}`;
function cumulative(text,isKorean=false){const advanced=['B2','C1','C2'].includes(L),units=[];text.split(/\n\n+/).map(v=>v.trim()).filter(Boolean).forEach((para,pi,all)=>{let pieces;if(isKorean&&advanced&&para.includes('¦'))pieces=para.split('¦').map(v=>v.trim()).filter(Boolean);else{const sentences=para.replace(/¦/g,' ').match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[para];pieces=advanced?sentences.flatMap(s=>(s.trim().match(/[^,;:]+[,;:]|[^,;:]+$/g)||[s]).map(v=>v.trim())):sentences.map(v=>v.trim())}pieces.forEach(v=>units.push(v));if(pi<all.length-1)units.push('\n\n')});let built='',steps=[];units.forEach(unit=>{if(unit==='\n\n'){built=built.trimEnd()+'\n\n';return}built=(built+(built.endsWith('\n\n')?'':' ')+unit).trimStart().replace(/\s+([,;:.!?])/g,'$1');steps.push(built.trim())});return steps}
function accumulateChunks(chunks){let built='';return chunks.map(chunk=>{built=`${built}${built?' ':''}${String(chunk).trim()}`.replace(/\s+([,;:.!?])/g,'$1');return built})}
function paragraphs(text){return text.split(/\n\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}
function render(x,krText){const original=x.length===7?x[3]:x[2],prompts=x.length===7?[x[4],x[5],x[6]]:[x[3],x[4],x[5]],topic=x[1]||'Story',pilot=window.STORYCAMP_PILOT?.[`${L}-${id}`],steps=pilot?accumulateChunks(pilot.en):cumulative(original),krSteps=pilot?accumulateChunks(pilot.ko):cumulative(String(krText||''),true),text=pilot?steps.at(-1):original;document.title=`${x[0]} · TalkTag Story Camp`;const snow=steps.map((step,i)=>{const kr=krSteps[i]||'';return `<article class="snow-step"><div class="step-label">단계 ${i+1}${i===steps.length-1?' · COMPLETE':''}</div><div class="step-text">${paragraphs(step)}</div>${kr?`<button class="kr-toggle" type="button" data-target="kr-${i}" aria-expanded="false">KR ▾</button><div class="step-kr" id="kr-${i}">${paragraphs(kr)}</div>`:''}</article>`}).join('');content.innerHTML=`<div class="ey">${L}-${String(id).padStart(2,'0')} · STORY CAMP${pilot?' · SEMANTIC CHUNK PILOT':''}</div><h1>${esc(x[0])}</h1><div class="topic">스노우볼 → 전체 읽기 → 회상 → 변형 → 바꿔 말하기 → 말하기</div><div class="progress"><span>1 · SNOWBALL</span><span>2 · READ</span><span>3 · RECALL</span><span>4 · CHANGE</span><span>5 · PARAPHRASE</span><span>6 · TALK</span></div><section class="section"><h2>1. 스노우볼</h2><p class="guide">앞의 내용을 그대로 유지하면서 완결된 생각을 하나씩 더해 전체 이야기로 확장하세요.</p><div class="snow-steps">${snow}</div></section><section class="section"><h2>2. 전체 읽기</h2><p class="guide">완성된 글의 흐름과 연결 관계를 확인하며 소리 내어 읽으세요.</p><div class="story">${paragraphs(text)}</div></section><section class="section"><h2>3. 회상</h2><p class="guide">원문을 가리고 핵심 상황, 변화, 결과를 기억에서 꺼냅니다.</p><div class="own-task"><b>RECALL</b>${esc(prompts[0]||'글의 핵심 내용을 보지 않고 세 문장으로 요약해 보세요.')}</div></section><section class="section"><h2>4. 변형</h2><p class="guide">기본 흐름을 유지한 채 인물, 장소, 이유, 행동 또는 결과를 바꾸어 다시 구성하세요.</p><div class="map"><div class="cue"><b>PERSON / PLACE</b><span>인물이나 장소 하나를 바꿉니다.</span></div><div class="cue"><b>REASON / RESULT</b><span>이유 또는 결과를 바꾸고 연결을 조정합니다.</span></div></div></section><section class="section"><h2>5. 바꿔 말하기</h2><p class="guide">단어만 교체하지 말고 같은 핵심을 다른 문장 구조와 자연스러운 표현으로 전달하세요.</p><div class="own-task"><b>PARAPHRASE</b>${esc(prompts[1]||'가장 중요한 생각을 다른 방식으로 다시 말해 보세요.')}</div></section><section class="section own"><h2>6. 말하기 · 전달하기</h2><p class="guide">원문을 보지 않고 자신의 표현으로 파트너에게 이야기한 뒤, 자신의 경험이나 의견을 연결하세요.</p><div class="own-task"><b>TALK TO YOUR PARTNER</b>${esc(prompts[2]||'비슷한 경험이나 자신의 생각을 연결해 이야기해 보세요.')}</div></section><nav class="nav"><a href="?level=${L}&id=${id===1?10:id-1}">← 이전</a><a href="storycamp-level.html?level=${L}">목록</a><a href="?level=${L}&id=${id===10?1:id+1}">다음 →</a></nav>`;document.querySelectorAll('.kr-toggle').forEach(button=>button.addEventListener('click',()=>{const panel=document.getElementById(button.dataset.target),open=panel.classList.toggle('open');button.setAttribute('aria-expanded',String(open));button.textContent=open?'KR ▴':'KR ▾'}))}
if(['C1','C2'].includes(L)){const script=document.createElement('script');script.src=L==='C1'?'readable-c1.js':'readable-c2.js';script.onload=()=>render(window.READABLE_ADVANCED[id-1],(window.READABLE_KR_ADVANCED?.[L]||[])[id-1]);script.onerror=()=>{content.innerHTML='<div class="error">자료를 불러오지 못했습니다.</div>'};document.head.appendChild(script)}else{fetch('readable-essay.html').then(r=>r.text()).then(src=>{const m=src.match(/const D=(\{[\s\S]*?\});\s*const q=/);if(!m)throw Error('data');let D;eval('D='+m[1]);render(D[L][id-1],(window.READABLE_KR?.[L]||[])[id-1])}).catch(()=>{content.innerHTML='<div class="error">자료를 불러오지 못했습니다.</div>'})}
</script></body></html>
