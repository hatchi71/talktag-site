    .story-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}.story-head .ey{flex:none}.story-head h1{margin:0;font-size:clamp(28px,5vw,44px)}.deck-shell{margin-top:8px}.deck-overview{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.deck-count{color:var(--g);font-size:12px;font-weight:950;letter-spacing:.05em}.deck-label{color:var(--m);font-size:12px;font-weight:750}.deck-track{height:5px;border-radius:999px;background:color-mix(in srgb,var(--tt-text,var(--n)) 12%,transparent);overflow:hidden}.deck-progress{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--b),var(--g));transition:width .24s ease}.deck-slide{display:none;margin-top:14px;min-height:430px}.deck-slide.is-active{display:block;animation:deck-in .22s ease both}.deck-slide .section{height:100%;margin-top:0}.deck-slide .snow-step{height:100%;border:0;border-radius:0;background:transparent;box-shadow:none}.deck-slide .snow-step .step-label{padding:0 0 12px;color:var(--g)}.deck-slide .snow-step .step-text{margin:0;padding:clamp(24px,5vw,46px);border:1px solid var(--l);border-left:0;border-radius:20px;background:linear-gradient(145deg,#fff,#f5f8fc)}.deck-slide .snow-step .step-text p{color:var(--tt-text,var(--n))!important;font-size:clamp(24px,4vw,36px);line-height:1.62}.deck-slide .snow-step .note-action{margin:14px 0 0;padding:12px 2px;background:transparent;color:var(--m);font-size:13px}.deck-slide .snow-step .note-action b{display:none}.deck-actions{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:18px;padding:12px max(0px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(0px,env(safe-area-inset-left));background:linear-gradient(180deg,transparent,var(--tt-bg,#fbfcfb) 24%)}.deck-button{min-height:48px;border:1px solid var(--tt-border,var(--l));border-radius:14px;background:var(--tt-card,#fff);color:var(--tt-text,var(--n));font:inherit;font-size:13px;font-weight:900;cursor:pointer}.deck-button.primary{border-color:var(--b);background:var(--b);color:#fff}.deck-button:disabled{opacity:.38;cursor:default}.deck-menu{position:relative}.deck-menu>summary{width:44px;height:48px;display:grid;place-items:center;border:1px solid var(--tt-border,var(--l));border-radius:14px;background:var(--tt-card,#fff);color:var(--tt-text,var(--n));font-size:20px;font-weight:900;cursor:pointer;list-style:none}.deck-menu>summary::-webkit-details-marker{display:none}.deck-menu-panel{position:absolute;left:0;bottom:58px;width:min(310px,calc(100vw - 32px));padding:10px;border:1px solid var(--tt-border,var(--l));border-radius:16px;background:var(--tt-card,#fff);box-shadow:0 18px 46px rgba(22,50,82,.2)}.deck-menu-panel button,.deck-menu-panel a{width:100%;min-height:44px;display:flex;align-items:center;padding:9px 11px;border:0;border-radius:10px;background:transparent;color:var(--tt-text,var(--n));text-align:left;text-decoration:none;font:inherit;font-size:13px;font-weight:850;cursor:pointer}.deck-menu-panel button:hover,.deck-menu-panel a:hover{background:color-mix(in srgb,var(--b) 8%,var(--tt-card,#fff))}.deck-menu-title{margin:8px 11px 5px;color:var(--m);font-size:10px;font-weight:900;letter-spacing:.1em}.deck-stage-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0;padding:4px}.deck-dot{width:36px;height:36px;border:1px solid var(--tt-border,var(--l));border-radius:10px;background:var(--tt-card,#fff);color:var(--tt-muted,#6a7e94);font-size:11px;font-weight:900;cursor:pointer}.deck-dot.is-active{border-color:var(--b);background:var(--b);color:#fff}.deck-dot.is-seen:not(.is-active){border-color:#b8ddc4;background:#edf8f0;color:#27734c}@keyframes deck-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:700px){.top.tt-themed-header{display:grid;grid-template-columns:44px minmax(0,1fr) auto;min-height:64px!important;padding:8px 12px!important;gap:8 <body><header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span>Snowballing Studio · Boot Camp · Story Camp</span></div><a class="back" id="back" href="story-camp.html">← Story Camp</a></header><main class="wrap" id="content"><div class="ey">STORY CAMP</div><h1>자료 불러오는 중…</h1></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const q=new URLSearchParams(location.search),allowed=['A1','A2','B1','B2','C1','C2'];let L=(q.get('level')||'A1').toUpperCase();if(!allowed.includes(L))L='A1';const familyNumber=String(q.get('family')||'001').padStart(3,'0');back.href=`storycamp-family.html?family=${familyNumber}`;
function accumulateChunks(chunks){let built='';return chunks.map(chunk=>{built=`${built}${built?' ':''}${String(chunk).trim()}`.replace(/\s+([,;:.!?])/g,'$1');return built})}
function paragraphs(text){return text.split(/\n\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}
function render(family){
  const curriculum=family?.levels?.[L];
  if(!curriculum||!Array.isArray(curriculum.lines))throw Error('curriculum');
  const steps=accumulateChunks(curriculum.lines),text=steps.at(-1),slides=[];
  const prompts=family.prompts||[`누가 무엇을 나누었고, 그 뒤 두 사람 사이에 어떤 변화가 생겼는지 떠올려 보세요.`,`내가 누군가와 작은 것을 나누었던 경험으로 바꾸어 보세요.`,`작은 호의가 관계를 바꾼 나의 이야기를 노트 없이 전달해 보세요.`];
  document.title=`${family.number} ${family.title} · TalkTag Story Camp`;
  steps.forEach((step,i)=>{
    slides.push(`<article class="deck-slide" data-label="누적 ${i+1}${i===steps.length-1?' · 이야기 완성':''}"><section class="section"><article class="snow-step"><div class="step-text">${paragraphs(step)}</div><div class="note-action">이 문장까지 이야기의 처음부터 다시 써 보세요.</div></article></section></article>`);
  });
  slides.push(`<article class="deck-slide" data-label="다시 쓰기"><section class="section"><p class="stage-purpose">2 · REWRITE</p><h2>전체 이야기 처음부터 다시 써보기</h2><p class="guide">지금까지 단계별로 누적해서 썼던 이야기 전체를 보지 않고 처음부터 다시 나의 노트에 적어 보세요.</p><div class="cover-note"><b>먼저 노트에 쓰세요</b>다 쓴 뒤에만 완성된 이야기를 열어 빠진 흐름과 표현을 확인합니다.</div><details class="story-reference"><summary>완성된 이야기 확인하기</summary><div class="story">${paragraphs(text)}</div></details></section></article>`);
  slides.push(`<article class="deck-slide" data-label="회상"><section class="section"><p class="stage-purpose">3 · RECALL</p><h2>회상해서 다시 써보기</h2><p class="guide">나의 노트와 원문을 모두 가리고, 생각나는 내용을 그대로 다시 써 보세요. 정확한 문장 복사보다 기억에서 이야기의 흐름을 꺼내는 것이 중요합니다.</p><div class="own-task"><b>MEMORY CUE · 막힐 때만</b>${esc(prompts[0]||'핵심 상황, 변화, 결과를 기억나는 순서대로 다시 써 보세요.')}</div></section></article>`);
  slides.push(`<article class="deck-slide" data-label="말하기"><section class="section"><p class="stage-purpose">4 · RETELL</p><h2>가리고 말하기</h2><p class="guide">3단계에서 쓴 내용도 다시 덮고, 파트너에게 이야기 전체를 처음부터 끝까지 전달해 보세요.</p><div class="cover-note"><b>노트를 덮고 시작하세요</b>멈추더라도 바로 원문을 보지 말고, 기억나는 표현으로 연결해서 끝까지 말합니다.</div></section></article>`);
  slides.push(`<article class="deck-slide" data-label="변형"><section class="section own"><p class="stage-purpose">5 · TRANSFORM</p><h2>나의 이야기로 변형하기</h2><p class="guide">원문의 구성과 주제는 유지하면서 인물, 장소, 이유, 행동 또는 결과를 바꾸어 나의 이야기나 의견을 새로 지어 나의 노트에 써 보세요.</p><div class="map"><div class="cue"><b>SAME STRUCTURE</b><span>시작–변화–결과의 흐름은 유지합니다.</span></div><div class="cue"><b>MY STORY / OPINION</b><span>나의 경험과 생각에 맞게 세부 내용을 바꿉니다.</span></div></div><div class="own-task"><b>TRANSFORM</b>같은 흐름을 사용해 나의 경험이나 의견으로 이야기 전체를 새로 써 보세요.<small>원문의 세부 포인트: ${esc(prompts[1]||'인물, 장소, 이유 또는 결과 중 하나를 바꾸어 보세요.')}</small></div></section></article>`);
  slides.push(`<article class="deck-slide" data-label="최종 말하기"><section class="section own"><p class="stage-purpose">6 · SHARE</p><h2>새로 지은 이야기 말하기</h2><p class="guide">5단계에서 쓴 나의 이야기나 의견을 다시 덮고, 파트너에게 자연스럽게 말해 보세요.</p><div class="own-task"><b>TALK TO YOUR PARTNER</b>${esc(prompts[2]||'새로 만든 이야기나 의견을 노트 없이 파트너에게 전달해 보세요.')}</div></section></article>`);
  content.innerHTML=`<div class="story-head"><div class="ey">${family.number} · ${L}</div><h1>${esc(family.title)}</h1></div><div class="deck-shell"><div class="deck-overview"><div class="deck-count" id="deckCount"></div><div class="deck-label" id="deckLabel"></div><button type="button" class="camp-kr-toggle" id="storyKorean" aria-label="현재 단계 한글 해석 보기" aria-expanded="false">KR</button></div><div class="deck-track" aria-hidden="true"><span class="deck-progress" id="deckProgress"></span></div><div id="deckSlides">${slides.join('')}</div><div class="deck-actions"><details class="deck-menu" id="deckMenu"><summary aria-label="학습 메뉴">•••</summary><div class="deck-menu-panel"><button type="button" id="deckRestart">처음부터 다시 보기</button><a href="storycamp-family.html?family=${family.number}">${family.number} ${esc(family.title)} 랜딩으로</a><a href="story-camp.html">Story Camp 목록으로</a><a href="vocalcamp-player.html?family=${family.number}&level=${L}">같은 번호 · 같은 레벨 Vocal Camp →</a><div class="deck-menu-title">단계 이동</div><div class="deck-stage-nav" id="deckStageNav" aria-label="학습 단계 바로가기"></div></div></details><button class="deck-button" id="deckPrev" type="button">← 이전</button><button class="deck-button primary" id="deckNext" type="button">다음 →</button></div></div>`;
  initDeck(slides.length, window.TalkTagBootCampKorean?.storycamp?.[family.number]?.[L]||[], curriculum.lines.length);
}
function initDeck(total, translations, sourceLength){
  const slides=[...document.querySelectorAll('.deck-slide')],nav=document.getElementById('deckStageNav'),key=`talktag-storycamp-card-${familyNumber}-${L}`;
  const countNode=document.getElementById('deckCount'),labelNode=document.getElementById('deckLabel'),progressNode=document.getElementById('deckProgress'),previousButton=document.getElementById('deckPrev'),nextButton=document.getElementById('deckNext'),restartButton=document.getElementById('deckRestart'),menu=document.getElementById('deckMenu');
  slides.forEach((slide,index)=>{const button=document.createElement('button');button.type='button';button.className='deck-dot';button.textContent=String(index+1);button.setAttribute('aria-label',`${index+1}단계 ${slide.dataset.label}`);button.addEventListener('click',()=>show(index));nav.append(button)});
  const kr=document.getElementById('storyKorean');
  kr.hidden=translations.length!==sourceLength;
  slides.forEach((slide,index)=>{const panel=document.createElement('section');panel.id='storyKr'+index;panel.className='camp-kr-panel';panel.lang='ko';panel.hidden=true;const lines=index<sourceLength?translations.slice(0,index+1):translations;if(index>=sourceLength){const note=document.createElement('p');note.className='camp-kr-note';note.textContent='회상·말하기 훈련에서는 먼저 기억으로 시도한 뒤 확인하세요.';panel.append(note)}const text=document.createElement('p');text.textContent=lines.join(' ');panel.append(text);(slide.querySelector('.step-text')||slide.querySelector('.section')).append(panel)});
  kr.addEventListener('click',()=>{const panel=slides[current].querySelector('.camp-kr-panel');panel.hidden=!panel.hidden;kr.setAttribute('aria-expanded',String(!panel.hidden));});
  let current=0;try{current=Math.max(0,Math.min(total-1,Number(localStorage.getItem(key)||0)))}catch(error){}
