<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalkTag Snowballing Essay</title><style>:root{--n:#082b68;--b:#1768e9;--o:#ff6a10;--l:#dde5f0;--s:0 16px 38px #18345518}*{box-sizing:border-box}body{margin:0;color:#183455;font-family:Inter,system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{height:72px;position:sticky;top:0;z-index:3;background:#fffffff2;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;align-items:center;gap:10px}.brand-home{display:flex;align-items:center;text-decoration:none}.brand img{width:64px;height:52px;object-fit:contain}.brand b,h1,h2{color:var(--n)}a{color:var(--b);text-decoration:none;font-weight:800;font-size:12px}.wrap{max-width:920px;margin:auto;padding:42px 22px 80px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--b)}h1{font-size:clamp(34px,5vw,54px);line-height:1.04;margin:9px 0}.topic{color:#728198}.rule{display:inline-block;padding:7px 10px;border-radius:999px;background:#eaf2ff;color:var(--b);font-size:10px;font-weight:850}.section{margin-top:38px}.step,.full,.prompt{background:#fff;border:1px solid var(--l);border-radius:17px;padding:19px 21px;margin:14px 0;box-shadow:var(--s)}.step:nth-child(even){margin-left:4%}.num{font-size:10px;font-weight:900;color:var(--o);letter-spacing:.1em}.step p,.full p{font-size:17px;line-height:1.72}.full{background:#fff7ae;border:0}.prompts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.prompt{margin:0;font-size:13px;line-height:1.5}.prompt b{display:block;color:var(--n);margin-bottom:7px}.nav{display:flex;justify-content:space-between;margin-top:35px}@media(max-width:650px){.top{padding:0 10px}.brand b{font-size:11px}.brand img{width:50px}.wrap{padding:28px 16px 65px}.step:nth-child(even){margin-left:0}.step p,.full p{font-size:16px}.prompts{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand"><a class="brand-home" href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><b>Snowballing Studio · Readable</b></div><a id="back" href="readable.html">← Level list</a></header><main class="wrap"><div class="ey" id="ey"></div><h1 id="title">Loading…</h1><p class="topic" id="topic"></p><span class="rule">STRICT SNOWBALL · each step contains the complete previous step</span><section class="section"><h2>1. Snowball</h2><p>Repeat everything from the previous step, then add the next meaningful chunk.</p><div id="steps"></div></section><section class="section"><h2>2. Read</h2><div class="full" id="full"></div></section><section class="section"><h2>3. Recall → Talk</h2><div class="prompts" id="prompts"></div></section><div class="nav"><a id="prev">← Previous</a><a id="next">Next →</a></div></main><script>
function makeStrict(first,level){let units=[];(first.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[first]).forEach(s=>{s=s.trim();if(level==='A1'){units.push(s);return}let p=s.match(/[^,;:]+[,;:]|[^,;:]+$/g)||[s];p.forEach(v=>units.push(v.trim()))});let built='',out=[];units.forEach(u=>{built=(built+' '+u).trim().replace(/\s+([,;:.!?])/g,'$1');out.push(built)});return out}
fetch('readable-essay.html').then(r=>r.text()).then(src=>{let m=src.match(/const D=(\{[\s\S]*?\});\s*const q=/);if(!m)throw Error('data');let D;eval('D='+m[1]);const q=new URLSearchParams(location.search),L=(q.get('level')||'A1').toUpperCase(),arr=D[L]||D.A1,id=Math.max(1,Math.min(10,Number(q.get('id'))||1)),x=arr[id-1];let text=x.length===7?x[3]:x[2],p=x.length===7?[x[4],x[5],x[6]]:[x[3],x[4],x[5]];ey.textContent=`${L} · READABLE ${String(id).padStart(3,'0')}`;title.textContent=x[0];topic.textContent=x[1]+' · Snowball → Read → Recall → Talk';back.href=`readable-level.html?level=${L}`;let first=text.split('\n\n')[0].trim(),st=makeStrict(first,L);steps.innerHTML=st.map((s,i)=>`<div class="step"><div class="num">STEP ${i+1}</div><p>${s}</p></div>`).join('');full.innerHTML=text.split('\n\n').map(v=>`<p>${v}</p>`).join('');prompts.innerHTML=[['Recall',p[0]],['Retrieve',p[1]],['Talk',p[2]]].map(z=>`<div class="prompt"><b>${z[0]}</b>${z[1]}</div>`).join('');prev.href=`readable-strict.html?level=${L}&id=${id===1?10:id-1}`;next.href=`readable-strict.html?level=${L}&id=${id===10?1:id+1}`}).catch(()=>{title.textContent='Unable to load essay';});
</script></body></html>
