<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082b68">
  <title>Sign in · TalkTag</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/account.css?v=member-sort-20261106">
  <script src="/auth-config.js?v=member-sort-20261106" defer></script>
  <script src="/assets/talktag-account.js?v=member-sort-20261106" defer></script>
</head>
<body>
  <header class="account-header">
    <a class="account-brand" href="/" aria-label="TalkTag home"><img src="/talktag-logo.png" width="46" height="46" alt=""><span>TalkTag</span></a>
    <a id="back-link" class="account-back" href="/" data-i18n="back">홈으로</a>
  </header>
  <main class="account-main">
    <section class="account-card" aria-labelledby="account-title">
      <p class="eyebrow">TALKTAG · ACCOUNT</p>
      <h1 id="account-title" data-i18n="title">함께 배워요.</h1>
      <p class="lead" data-i18n="lead">카카오 또는 이메일로 로그인하세요.</p>
      <p id="account-status" class="status" role="status" aria-live="polite"></p>
      <div id="signed-out" hidden>
        <div class="auth-methods" role="group" id="account-mode"><button type="button" id="mode-login" aria-pressed="true">로그인</button><button type="button" id="mode-register" aria-pressed="false">회원가입</button></div>
        <button id="google-button" class="action google" type="button" hidden><span aria-hidden="true">G</span><span data-i18n="google">Google로 계속하기</span></button>
        <button id="kakao-button" class="action kakao" type="button"><span aria-hidden="true">●</span><span data-i18n="kakao">카카오로 계속하기</span></button>
        <div class="divider"><span data-i18n="or">또는 이메일</span></div>
        <div id="login-methods" class="auth-methods" role="group" aria-label="Email login method"><button type="button" id="use-password" aria-pressed="true" data-i18n="passwordMethod">이메일 + 비밀번호</button><button type="button" id="use-code" aria-pressed="false" data-i18n="codeMethod">이메일 인증번호</button></div>
        <form id="register-form" hidden>
          <h2 id="register-title">이메일로 회원가입</h2>
          <label for="register-name" id="register-name-label">이름 또는 닉네임</label><input id="register-name" type="text" autocomplete="nickname" minlength="2" maxlength="40" required>
          <label for="register-email" id="register-email-label">이메일 주소</label><input id="register-email" type="email" autocomplete="email" maxlength="254" required>
          <label for="register-password" id="register-password-label">비밀번호</label><input id="register-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="password-rules">
          <ul id="password-rules" class="password-rules"></ul>
          <label for="register-confirm" id="register-confirm-label">비밀번호 확인</label><input id="register-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
          <button id="register-submit" class="action email" type="submit">회원가입</button>
        </form>
        <form id="email-form">
          <label for="email" data-i18n="emailLabel">이메일 주소</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" placeholder="you@example.com">
          <div id="password-field"><label for="password" data-i18n="passwordLabel">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div>
          <button id="email-button" class="action email" type="submit" data-i18n="emailButton">로그인 링크 받기</button>
        </form>
        <form id="code-form" hidden><label for="email-code" data-i18n="codeLabel">이메일 인증번호</label><input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" minlength="6" maxlength="8" required><button type="submit" id="verify-code" class="action email" data-i18n="verifyCode">인증하고 로그인</button></form>
        <button id="set-password-start" class="auth-text-button" type="button" data-i18n="newPassword">처음이거나 비밀번호를 잊으셨나요?</button>
        <p class="hint" data-i18n="emailHint">비밀번호가 필요 없는 일회용 로그인 링크를 보내드립니다.</p>
      </div>
      <div id="signed-in" hidden>
        <p class="signed-in-label" data-i18n="signedIn">로그인되었습니다</p>
        <p id="account-email" class="account-email"></p>
        <form id="member-name-form" class="access-panel"><h2 id="member-name-title">이름 또는 닉네임</h2><label for="member-name" id="member-name-label">회원 관리에 사용할 이름</label><input id="member-name" type="text" autocomplete="nickname" minlength="2" maxlength="40" required><p id="member-name-help"></p><button type="submit" id="save-member-name" class="action email">이름 저장</button><p id="member-name-status" role="status"></p></form>
        <section id="access-panel" class="access-panel" aria-labelledby="access-heading" aria-live="polite">
          <p id="access-heading" class="access-kicker" data-i18n="accessHeading">회원 상태</p>
          <strong id="access-title" class="access-title"></strong>
          <p id="access-description" class="access-description"></p>
        </section>
        <section id="member-history" class="access-panel" aria-live="polite"></section>
        <form id="set-password-form" hidden><h2 data-i18n="setPasswordTitle">비밀번호 설정</h2><label for="new-password" data-i18n="newPasswordLabel">새 비밀번호 (12자 이상)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm-password" data-i18n="confirmPassword">비밀번호 확인</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save-password" type="submit" class="action email" data-i18n="savePassword">비밀번호 저장</button></form>
        <button id="manage-password" class="auth-text-button" type="button" data-i18n="managePassword" hidden>비밀번호 설정 / 변경</button>
        <button id="signout-button" class="action secondary" type="button" data-i18n="signOut">로그아웃</button>
      </div>
      <p id="device-policy-note" class="account-footnote"></p>
      <p class="account-footnote" data-i18n="accessNote">로그인만으로 유료 콘텐츠 이용권이 생기지는 않습니다.</p>
    </section>
  </main>
</body>
</html>
