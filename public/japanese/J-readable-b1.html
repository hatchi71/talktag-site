<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening TalkTag…</title><p>Opening your TalkTag practice area…</p><script>
const q=new URLSearchParams(location.search),id=q.get('id');
const language=['en','ko','ja'].includes(q.get('lang'))?q.get('lang'):'ja';
const level=/^(A0|A1|A2|B1|B2|C1|C2)$/i.test(q.get('level')||'')?q.get('level').toUpperCase():'B1';
const area=q.get('type')==='plain'?'mini-talks':'readable';
const cards=[{"cardId":"en-readable-001-a1","language":"en","area":"readable","level":"A1","ordinal":1},{"cardId":"en-readable-001-a2","language":"en","area":"readable","level":"A2","ordinal":1},{"cardId":"en-readable-001-b1","language":"en","area":"readable","level":"B1","ordinal":1},{"cardId":"en-readable-001-b2","language":"en","area":"readable","level":"B2","ordinal":1},{"cardId":"en-readable-001-c1","language":"en","area":"readable","level":"C1","ordinal":1},{"cardId":"en-readable-001-c2","language":"en","area":"readable","level":"C2","ordinal":1},{"cardId":"ko-readable-a0-001","language":"ko","area":"readable","level":"A0","ordinal":1},{"cardId":"ko-readable-a1-001","language":"ko","area":"readable","level":"A1","ordinal":1},{"cardId":"ko-readable-a2-001","language":"ko","area":"readable","level":"A2","ordinal":1},{"cardId":"ko-readable-b1-001","language":"ko","area":"readable","level":"B1","ordinal":1},{"cardId":"ko-readable-b2-001","language":"ko","area":"readable","level":"B2","ordinal":1},{"cardId":"ko-readable-c1-001","language":"ko","area":"readable","level":"C1","ordinal":1},{"cardId":"ko-readable-c2-001","language":"ko","area":"readable","level":"C2","ordinal":1}];
const selected=cards.find(c=>c.language===language&&c.level===level&&c.ordinal===Number(q.get('family')||q.get('access-index')||1));
const player=false;
const cardId=id&&/^[a-z0-9-]{1,160}$/.test(id)?id:player&&selected?selected.cardId:null;
const libraries={en:{'vocal-camp':'/vocal-camp.html','story-camp':'/story-camp.html',readable:'/readable.html','test-content':'/test-preppers.html'},ko:{'vocal-camp':'/K-korean-vocal-camp.html','story-camp':'/K-korean-story-camp.html',readable:'/K-korean-readable.html','test-content':'/K-korean.html'},ja:{'vocal-camp':'/japanese/J-vocal-camp.html','story-camp':'/japanese/J-story-camp.html',readable:'/japanese/J-snowballing.html#readable','test-content':'/japanese/J-test-preppers.html'}};
let next=cardId?'/protected-card.html?id='+encodeURIComponent(cardId):libraries[language][area];
if(!next&&['guided-listen-repeat','mini-talks'].includes(area))next=(language==='ko'?'/K-korean-audio-library.html':language==='ja'?'/japanese/J-guided.html':'/audio-library.html')+'?type='+(area==='mini-talks'?'plain':'guided');
if(!next)next=language==='ko'?'/K-korean.html':language==='ja'?'/japanese/J-index.html':'/E-english.html';
if(!cardId&&area!=='test-content'&&!next.includes('#')&&(q.has('level')||true))next+=(next.includes('?')?'&':'?')+'level='+encodeURIComponent(level);
location.replace(next);</script><noscript><a href="/">TalkTag home</a></noscript></html>
