<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Story Camp Level · TalkTag</title>
  <style>
    :root{--n:#082b68;--b:#1768e9;--g:#248153;--o:#ff6a10;--l:#dbe5f1;--m:#687b92;--s:0 15px 35px rgba(24,52,85,.09)}*{box-sizing:border-box}body{margin:0;color:#183455;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#fbfcfb;background-image:radial-gradient(#dce6f0 1px,transparent 1px);background-size:24px 24px}.top{height:74px;position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:11px;color:var(--n);font-weight:850}.brand a{display:flex}.brand img{width:68px;height:54px;object-fit:contain}.back{color:var(--b);text-decoration:none;font-size:12px;font-weight:850}.wrap{max-width:1000px;margin:auto;padding:45px 22px 82px}.ey{font-size:11px;color:var(--g);font-weight:950;letter-spacing:.13em}h1{font-size:clamp(42px,6vw,58px);color:var(--n);margin:8px 0}.intro{max-width:720px;color:var(--m);line-height:1.7}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:31px}.item{position:relative;display:block;min-height:145px;padding:19px;border:1px solid var(--l);border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:var(--s);transition:.16s}.item:hover{transform:translateY(-3px);border-color:#84c6a1}.num{font-size:10px;color:var(--o);font-weight:950;letter-spacing:.08em}.item h2{font-size:19px;color:var(--n);margin:8px 0}.item p{font-size:12px;color:#728198;margin:0;line-height:1.55}.item:after{content:"RETELL →";position:absolute;right:18px;bottom:17px;color:var(--g);font-size:9px;font-weight:950}.error{margin-top:30px;padding:20px;border-radius:16px;background:#fff0e8;color:#9b4725}@media(max-width:680px){.top{height:68px;padding:0 12px}.brand img{width:56px}.brand span{font-size:12px}.wrap{padding:30px 16px 65px}.list{grid-template-columns:1fr}}
  </style>
  <script src="/talktag-home.js?v=1" defer></script>
</head>
<body><header class="top"><div class="brand"><a href="index.html" aria-label="TalkTag Home"><img src="talktag-logo.png" alt="TalkTag Home"></a><span>Snowballing Studio · Boot Camp · Story Camp</span></div><a class="back" href="story-camp.html">← Story Camp</a></header><main class="wrap"><div class="ey" id="ey">STORY CAMP</div><h1 id="title">자료 불러오는 중…</h1><p class="intro" id="intro"></p><div class="list" id="list"></div></main>
<script>
const descriptions={A1:'익숙한 행동과 일상 상황을 짧은 이야기로 다시 말합니다.',A2:'친숙한 상황의 이유, 변화, 결과를 연결해 재구성합니다.',B1:'경험과 선택, 결과와 성찰을 하나의 이야기로 전달합니다.',B2:'관점과 근거, 함축된 의미를 포함해 풍부하게 재구성합니다.',C1:'복합적인 주장과 관점을 이야기의 흐름으로 정교하게 전달합니다.',C2:'뉘앙스와 논리 구조를 유지하며 자신의 목소리로 다시 말합니다.'};
const params=new URLSearchParams(location.search);let level=(params.get('level')||'A1').toUpperCase();if(!descriptions[level])level='A1';
fetch('readable-level.html').then(r=>r.text()).then(src=>{const m=src.match(/const T=(\{[\s\S]*?\});const desc=/);if(!m)throw Error('data');let T;eval('T='+m[1]);const items=T[level]||[];document.title=`${level} Story Camp · TalkTag`;ey.textContent=`${level} · ${items.length} STORIES`;title.textContent=`${level} Story Camp`;intro.textContent=descriptions[level];list.innerHTML=items.map((x,i)=>`<a class="item" href="storycamp-reader.html?level=${level}&id=${i+1}"><div class="num">${level}-${String(i+1).padStart(2,'0')} · ${x[1]}</div><h2>${x[0]}</h2><p>Read → Map → Retell → Own</p></a>`).join('')}).catch(()=>{title.textContent='자료를 불러오지 못했습니다.';list.innerHTML='<div class="error">Readable 원본 데이터 연결을 확인해 주세요.</div>'});
</script></body></html>
