<!doctype html>
<html lang="ko" data-appearance="bright">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082b68">
  <title>연결을 확인해 주세요 · TalkTag</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#f8f5ee;color:#183455;font:16px/1.6 system-ui,-apple-system,sans-serif}.card{width:min(100%,480px);padding:32px 24px;border:1px solid #d8d4ca;border-radius:24px;background:#fffcf5;box-shadow:0 18px 48px #18345518;text-align:center}.logo{width:104px;height:104px;object-fit:contain;border-radius:22px}h1{margin:16px 0 8px;font-size:28px;line-height:1.25;color:#082b68}p{margin:0 0 22px;color:#5d6979}button{min-width:160px;min-height:48px;padding:0 20px;border:1px solid #1768d5;border-radius:14px;background:#1768d5;color:#fff;font:800 16px system-ui;box-shadow:0 3px 0 #0b438f;cursor:pointer}button:active{transform:translateY(1px);box-shadow:0 1px 0 #0b438f}@media(prefers-color-scheme:dark){body{background:#030916;color:#e6ecf6}.card{background:#0b172b;border-color:#2a3c56}h1{color:#e6ecf6}p{color:#adbcd0}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/talktag-192.png" alt="TalkTag">
    <h1>인터넷 연결을 확인해 주세요.</h1>
    <p>TalkTag 화면은 준비되어 있습니다. 연결이 돌아오면 다시 이어서 학습할 수 있습니다.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
